name: catatuang
description: "App untuk manajemen keuangan"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.10.3

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  intl: ^0.19.0
  fl_chart: ^0.68.0
  flutter_local_notifications: ^17.1.2
  timezone: ^0.9.2
  flutter_timezone: ^3.0.1
  share_plus: ^10.0.0
  file_picker: ^8.0.0
  path_provider: ^2.1.4

  # Firebase
  firebase_core: ^3.8.0
  firebase_auth: ^5.3.4
  cloud_firestore: ^5.5.0
  google_sign_in: ^6.2.2

  # Security
  local_auth: ^2.3.0          # biometric/PIN lock
  flutter_secure_storage: ^9.2.2  # simpan PIN terenkripsi


dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.7

flutter:
  assets:
    - assets/icons/
  uses-material-design: true

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icons/icon.png"
  min_sdk_android: 21

flutter_native_splash:
  color: "#0F6E56"
  image: assets/icons/icon.png
  color_dark: "#085041"
  image_dark: assets/icons/icon.png
  android: true
  ios: false